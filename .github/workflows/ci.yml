name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  conventions:
    name: Branch and commit names
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Branch name
        run: node scripts/validate-branch-name.mjs "${{ github.head_ref }}"
      - name: Commit messages
        run: node scripts/validate-commit-msg.mjs --range "origin/${{ github.base_ref }}..HEAD"

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
