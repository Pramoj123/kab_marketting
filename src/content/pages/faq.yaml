  - discriminant: "faq"
    value:
      heading: "Questions about ordering"
      intro: "The questions people ask most before they order. Every order is confirmed with you on WhatsApp before we bake."
      items:
        - question: "How do I order?"
          answer: "Choose a size and flavour on the menu, then tap Order this bake. For custom cakes, gift boxes and bulk orders, fill in the custom order form and send it to us on WhatsApp."
        - question: "How much does it cost?"
          answer: "Prices depend on the item, size and design. Message us on WhatsApp and we will share the price."
        - question: "Where do you deliver?"
          answer: "We deliver within Chennai. Delivery charges depend on your area, so we confirm them on WhatsApp when you order."
        - question: "How much notice do you need?"
          answer: "Most bakes need at least one day. Bento cakes need two days. The notice for each item is shown on its card."
        - question: "How do I pay?"
          answer: "We accept UPI, including GPay and PhonePe. An advance payment confirms your order, and we share the details on WhatsApp."
        - question: "Can I customise a cake?"
          answer: "Yes. Bento cakes can carry your own message, colours and flavour. Use the custom order form and tell us what you have in mind."
        - question: "Do you take bulk or corporate orders?"
          answer: "Yes. Share the quantity, date and occasion in the custom order form and we will confirm what we can do."
        - question: "What about allergies?"
          answer: "Please tell us about any allergies when you order. Our bakes are made in a home kitchen that also handles ingredients such as wheat, milk, eggs and nuts."
  - discriminant: "contact"
    value:
      heading: "Questions on WhatsApp"
      intro: "Message us for anything not answered here."
